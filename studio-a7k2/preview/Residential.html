<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom Kitchens, Closets and Built-ins | SnM Millwork Manufacturing</title><meta name="description" content="Kitchens, vanities, closets, built-ins and resin pieces designed with you, made in our shop and installed by the people who built them."><link rel="icon" type="image/png" href="../../design-draft/media/favicon-64.png"><link rel="apple-touch-icon" href="../../design-draft/media/favicon-180.png"><link rel="stylesheet" href="snm.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#FFFFFF}</style>
<script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menuOpen: false, filter: 'all', lb: -1, review: 0, reviewsPaused: false };
  }
  componentDidMount() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    this.t = setInterval(() => { if (!this.state.reviewsPaused) this.setState({ review: (this.state.review + 1) % 4 }); }, 7000);
  }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const s = this.state;
    const all = [
      { c: 'kitchen', cat: 'Kitchen', name: '[Walnut kitchen and island]', src: '../../design-draft/media/kit2.webp', alt: 'Walnut kitchen with a large island' },
      { c: 'closet', cat: 'Closet', name: '[Walnut walk-in closet]', src: '../../design-draft/media/clo2.webp', alt: 'Walnut-panelled walk-in closet' },
      { c: 'bath', cat: 'Bath', name: '[Oak vanity, powder room]', src: '../../design-draft/media/van1.webp', alt: 'Wood vanity with stone basin' },
      { c: 'kitchen', cat: 'Kitchen', name: '[Oak and charcoal kitchen]', src: '../../design-draft/media/kit1.webp', alt: 'Kitchen with oak cabinets and charcoal tall units' },
      { c: 'resin', cat: 'Resin', name: '[Live-edge resin table]', src: '../../design-draft/media/t1.webp', alt: 'Live-edge wood slab with black resin' },
      { c: 'closet', cat: 'Built-in', name: '[Built-in media wall]', src: '../../design-draft/media/tv2.webp', alt: 'Built-in wood media wall with lit shelves' }
    ];
    const shown = s.filter === 'all' ? all : all.filter((p) => p.c === s.filter);
    const n = shown.length;
    const lbItem = s.lb >= 0 && s.lb < n ? shown[s.lb] : shown[0];
    const reviews = [
      { q: 'Our walnut kitchen is the best decision we made in the renovation. Every drawer lines up and the finish is perfect.', name: '[Sample: Priya and Sam K.]', meta: 'Kitchen, Oakville' },
      { q: 'Honest pricing, clear updates with photos, and a closet that finally fits everything.', name: '[Sample: Angela P.]', meta: 'Walk-in closet, Vaughan' },
      { q: 'They protected our floors, cleaned up every day and finished a day early.', name: '[Sample: James W.]', meta: 'Built-ins, Toronto' },
      { q: 'The river table is the first thing guests notice. We picked the slab and resin colour in person.', name: '[Sample: Laura M.]', meta: 'Resin dining table, Burlington' }
    ];
    const pad = (x) => String(x).padStart(2, '0');
    return {
      showIntro: this._intro === undefined ? (this._intro = (() => { try { if (sessionStorage.getItem('snmIntro') === '1') return false; sessionStorage.setItem('snmIntro', '1'); } catch (e) { return false; } if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return false; setTimeout(() => { this._intro = false; }, 3200); return true; })()) : this._intro,
      skipIntro: () => { this._intro = false; this.setState({}); },
      year: new Date().getFullYear(),
      menuOpen: s.menuOpen,
      menuOpenStr: s.menuOpen ? 'true' : 'false',
      toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }),
      filters: [['all', 'All'], ['kitchen', 'Kitchens'], ['bath', 'Baths'], ['closet', 'Closets'], ['resin', 'Resin pieces']].map(([id, label]) => ({
        label, cls: s.filter === id ? 'pill on' : 'pill', pressed: s.filter === id ? 'true' : 'false', pick: () => this.setState({ filter: id, lb: -1 })
      })),
      shots: shown.map((p, i) => ({ ...p, open: 'Open photo: ' + p.alt, view: () => this.setState({ lb: i }) })),
      lbOpen: s.lb >= 0,
      lb: lbItem,
      lbCount: pad(s.lb + 1) + ' / ' + pad(n),
      closeLb: () => this.setState({ lb: -1 }),
      prevLb: () => this.setState({ lb: (s.lb + n - 1) % n }),
      nextLb: () => this.setState({ lb: (s.lb + 1) % n }),
      review: reviews[s.review],
      reviewDots: reviews.map((r, i) => ({ cls: i === s.review ? 'dot on' : 'dot', pressed: i === s.review ? 'true' : 'false', label: 'Review ' + (i + 1), pick: () => this.setState({ review: i }) })),
      prevReview: () => this.setState({ review: (s.review + reviews.length - 1) % reviews.length }),
      nextReview: () => this.setState({ review: (s.review + 1) % reviews.length }),
      pauseReviews: () => this.setState({ reviewsPaused: true }),
      resumeReviews: () => this.setState({ reviewsPaused: false })
    };
  }
}
</script></head><body><template id="tpl">
