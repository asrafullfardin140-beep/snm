class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menuOpen: false, open: 0 };
  }
  renderVals() {
    const s = this.state;
    const faqs = [
      ["Can you build from our architect's drawings?", 'Yes. We review them, produce shop drawings if needed and fabricate to the approved set.'],
      ['Can you make one sample first?', 'Yes. A prototype lets you approve size, finish and detail before the full run.'],
      ['Do you take on production runs?', 'Yes, for commercial rollouts. [Confirm typical quantities with SnM.]']
    ].map(([q, a], i) => ({
      q, a, open: s.open === i, expanded: s.open === i ? 'true' : 'false',
      icon: s.open === i ? 'M3 8h10' : 'M3 8h10M8 3v10',
      toggle: () => this.setState({ open: s.open === i ? -1 : i })
    }));
    return {
      showIntro: this._intro === undefined ? (this._intro = (() => { try { if (sessionStorage.getItem('snmIntro') === '1') return false; sessionStorage.setItem('snmIntro', '1'); } catch (e) { return false; } if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return false; setTimeout(() => { this._intro = false; }, 3200); return true; })()) : this._intro,
      skipIntro: () => { this._intro = false; this.setState({}); },
      year: new Date().getFullYear(),
      menuOpen: s.menuOpen,
      menuOpenStr: s.menuOpen ? 'true' : 'false',
      toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }),
      faqs
    };
  }
}
