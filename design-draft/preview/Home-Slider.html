<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SnM Millwork Manufacturing | Custom Millwork, Cabinetry and Epoxy Resin</title><meta name="description" content="SnM Millwork Manufacturing designs, builds and installs custom millwork, cabinetry, epoxy resin pieces and interior fit-outs for businesses and homes. From Concept to Completion."><link rel="icon" type="image/png" href="../media/favicon-64.png"><link rel="apple-touch-icon" href="../media/favicon-180.png"><link rel="stylesheet" href="snm.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&amp;family=Cormorant+Garamond:ital,wght@0,500;1,500&amp;family=Jost:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#121212}a{color:#F5A546}a:hover{color:#FFC27A}</style>
<script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { introDone: (() => { try { if (sessionStorage.getItem('snmIntro') === '1') return true; } catch (e) {} return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); })(), menuOpen: false, slide: 0, slidesPaused: false, dragPx: 0, dragging: false, review: 0, reviewsPaused: false };
    this.drag = null;
  }
  componentDidMount() {
    this.reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (!this.state.introDone) { try { sessionStorage.setItem('snmIntro', '1'); } catch (e) {} this.it = setTimeout(() => this.setState({ introDone: true }), 3000); }
    if (this.reduce) return;
    this.rt = setInterval(() => this.setState({ rot: (this.state.rot || 0) + 1 }), 3200);
    this.t1 = setInterval(() => { if (!this.state.slidesPaused && !this.drag) this.setState({ slide: (this.state.slide + 1) % (this.nSlides || 6) }); }, 7000);
    this.t2 = setInterval(() => { if (!this.state.reviewsPaused) this.setState({ review: (this.state.review + 1) % 5 }); }, 7000);
  }
  componentWillUnmount() { clearInterval(this.t1); clearInterval(this.t2); clearInterval(this.rt); clearTimeout(this.it); if (this.onLit) { window.removeEventListener('scroll', this.onLit); window.removeEventListener('resize', this.onLit); } if (this.onStory) { window.removeEventListener('scroll', this.onStory); window.removeEventListener('resize', this.onStory); } }
  renderVals() {
    const s = this.state;
    const slides = [
      { src: '../media/wall-blue-slide.webp', alt: 'Resin river feature wall with blue LED lighting in a restaurant', kind: 'Commercial', name: 'Resin river feature wall' },
      { src: '../media/library/ai-wall-staged.webp', alt: 'Resin river feature wall above red leather booths in a restaurant', kind: 'Commercial', name: 'Restaurant feature wall' },
      { src: '../media/shop1.webp', alt: 'Woodworking shop with table saw and stacked lumber', kind: 'Our shop', name: '[Built in our own shop]' },
      { src: '../media/rec1.webp', alt: 'Reception desk with a wood-slat feature wall', kind: 'Commercial', name: '[Office reception desk]' },
      { src: '../media/table-blue-v2.webp', alt: 'Live-edge slabs with a blue resin river and bark inlays', kind: 'Epoxy & Resin', name: 'Blue river table' },
      { src: '../media/table-red-v2.webp', alt: 'Live-edge slabs with a deep red resin river and bark inlays', kind: 'Epoxy & Resin', name: 'Red river table' },
      { src: '../media/off2.webp', alt: 'Executive office with walnut millwork and lit shelving', kind: 'Commercial', name: '[Executive office millwork]' },
      { src: '../media/kit1.webp', alt: 'Kitchen with wood and black cabinetry', kind: 'Residential', name: '[Wood and black kitchen]' },
      { src: '../media/cnc1.webp', alt: 'CNC machine cutting a wood panel', kind: 'Fabrication', name: '[CNC precision cutting]' }
    ].map((x, i) => ({ ...x, pos: (i + 1) + ' of 6', cls: 'slide ' + (i % 2 ? 'kb-out' : 'kb-in') + (i === s.slide ? ' on' : '') }));
    const reviews = [
      { q: 'They turned a rough sketch into a reception desk our whole office talks about. On time, on budget, and the install crew left the site spotless.', name: '[Sample: Daniel R.]', meta: 'Commercial, office reception' },
      { q: 'Our walnut kitchen is the best decision we made in the renovation. Every drawer lines up and the finish is perfect.', name: '[Sample: Priya and Sam K.]', meta: 'Residential, kitchen' },
      { q: 'The river table is the first thing guests notice. They let us pick the slab and the resin colour in person.', name: '[Sample: Laura M.]', meta: 'Epoxy & Resin, dining table' },
      { q: 'Shop drawings came back fast and clean. As a GC, that is exactly what we need from a millwork trade.', name: '[Sample: Mike T.]', meta: 'Commercial, general contractor' },
      { q: 'Honest pricing, clear updates with photos, and a closet that finally fits everything.', name: '[Sample: Angela P.]', meta: 'Residential, walk-in closet' }
    ];
    this.nSlides = slides.length;
    const pad = (n) => String(n).padStart(2, '0');
    return {
      year: new Date().getFullYear(),
      showIntro: !this.state.introDone,
      skipIntro: () => { clearTimeout(this.it); this.setState({ introDone: true }); },
      litRef: (el) => {
        if (!el) return;
        if (!this.litBound) {
          this.litBound = true;
          this.onLit = () => {
            const box = document.querySelector('.lit');
            if (!box) return;
            const ws = box.querySelectorAll('.lw');
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { ws.forEach((w) => w.classList.add('on')); return; }
            const r = box.getBoundingClientRect();
            const p = Math.min(1, Math.max(0, (window.innerHeight * 0.8 - r.top) / (r.height * 0.9)));
            const k = Math.round(p * ws.length);
            ws.forEach((w, i) => w.classList.toggle('on', i < k));
          };
          window.addEventListener('scroll', this.onLit, { passive: true });
          window.addEventListener('resize', this.onLit);
        }
        setTimeout(this.onLit, 0);
      },
      storyRef: (el) => {
        if (!el) return;
        if (!this.storyBound) {
          this.storyBound = true;
          this.onStory = () => {
            const box = document.querySelector('.story');
            if (!box || box.offsetParent === null) return;
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            const r = box.getBoundingClientRect();
            const run = Math.max(1, r.height - window.innerHeight);
            const p = Math.min(1, Math.max(0, -r.top / run));
            const n = 4, x = p * (n - 1);
            box.style.setProperty('--p', p.toFixed(4));
            box.querySelectorAll('.story-frame').forEach((f, i) => {
              const d = Math.abs(x - i);
              f.style.opacity = Math.max(0, Math.min(1, 1.6 - d * 1.6)).toFixed(3);
              f.style.transform = 'scale(' + (1.1 - 0.1 * Math.min(1, Math.max(0, x - i + 1) / 2)).toFixed(4) + ')';
            });
            box.querySelectorAll('.story-cap').forEach((c, i) => {
              const d = x - i;
              const o = Math.max(0, 1 - Math.abs(d) * 2.2);
              c.style.opacity = o.toFixed(3);
              c.style.transform = 'translateY(' + (d * -36).toFixed(1) + 'px)';
              c.style.visibility = o > 0.02 ? 'visible' : 'hidden';
            });
            box.querySelectorAll('.story-tick').forEach((t, i) => t.classList.toggle('on', Math.round(x) >= i));
            const glow = box.querySelector('.story-glow');
            if (glow) glow.style.opacity = Math.max(0, Math.min(1, (x - 2.3) / 0.7)).toFixed(3);
            const hint = box.querySelector('.story-hint');
            if (hint) hint.style.opacity = Math.max(0, 1 - p * 8).toFixed(3);
          };
          window.addEventListener('scroll', this.onStory, { passive: true });
          window.addEventListener('resize', this.onStory);
        }
        setTimeout(this.onStory, 0);
      },
      rotWords: ['Custom Millwork.', 'Kitchens & Vanities.', 'Epoxy River Tables.', 'Reception Desks.', 'Feature Walls.', 'Interior Fit-Outs.'].map((w, i, a) => { const c = (this.state.rot || 0) % a.length, p = (c + a.length - 1) % a.length; return { t: w, cls: i === c ? 'on' : (i === p && this.state.rot ? 'out' : '') }; }),
      cmpPos: this.cmpPos == null ? 50 : this.cmpPos,
      cmpRef: (el) => {
        if (!el || this.cmpHinted || el.__hint) return;
        el.__hint = true;
        if (typeof IntersectionObserver === 'undefined' || (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
        const io = new IntersectionObserver((es) => {
          if (!es[0].isIntersecting || this.cmpHinted) return;
          this.cmpHinted = true; io.disconnect();
          let stop = false;
          ['pointerdown', 'keydown', 'touchstart'].forEach((ev) => el.addEventListener(ev, () => { stop = true; }, { once: true }));
          const set = (p) => { this.cmpPos = Math.round(p * 2) / 2; el.style.setProperty('--pos', this.cmpPos + '%'); const r = el.querySelector('.cmp-range'); if (r) r.value = this.cmpPos; };
          const keys = [[0, 50], [700, 68], [1500, 34], [2200, 50]];
          const ease = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
          const t0 = Date.now();
          const step = () => {
            if (stop) return;
            const t = Date.now() - t0;
            const i = keys.findIndex((k) => k[0] > t);
            if (i === -1) { set(50); return; }
            const [ta, pa] = keys[i - 1], [tb, pb] = keys[i];
            set(pa + (pb - pa) * ease((t - ta) / (tb - ta)));
            setTimeout(step, 16);
          };
          setTimeout(step, 350);
        }, { threshold: 0.6 });
        io.observe(el);
      },
      cmpMove: (e) => { this.cmpPos = Number(e.target.value); const box = e.target.closest('.cmp'); if (box) box.style.setProperty('--pos', this.cmpPos + '%'); },
      menuOpen: s.menuOpen,
      menuOpenStr: s.menuOpen ? 'true' : 'false',
      toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }),
      slides,
      sliderCls: s.dragging ? 'slider hero-slider dragging' : 'slider hero-slider',
      slideX: (-100 * s.slide) + '%',
      dragPx: s.dragPx,
      slideDots: slides.map((x, i) => ({ cls: i === s.slide ? 'dot on' : 'dot', pressed: i === s.slide ? 'true' : 'false', label: 'Slide ' + (i + 1), pick: () => this.setState({ slide: i }) })),
      // Swipe with a finger or drag with a mouse; a short move still counts as a tap on buttons.
      dragStart: (e) => { if (e.target.closest && e.target.closest('button, a')) return; this.drag = { x: e.clientX, dx: 0 }; },
      dragMove: (e) => {
        if (!this.drag) return;
        const dx = e.clientX - this.drag.x; this.drag.dx = dx;
        if (Math.abs(dx) > 6) this.setState({ dragPx: dx, dragging: true });
      },
      dragEnd: () => {
        if (!this.drag) return;
        const dx = this.drag.dx; this.drag = null;
        const n = slides.length; let i = this.state.slide;
        if (dx < -50) i = (i + 1) % n; else if (dx > 50) i = (i + n - 1) % n;
        this.setState({ slide: i, dragPx: 0, dragging: false });
      },
      onKey: (e) => {
        if (e.key === 'ArrowRight') { e.preventDefault(); this.setState({ slide: (s.slide + 1) % slides.length }); }
        if (e.key === 'ArrowLeft') { e.preventDefault(); this.setState({ slide: (s.slide + slides.length - 1) % slides.length }); }
      },
      slideCount: pad(s.slide + 1) + ' / ' + pad(slides.length),
      prevSlide: () => this.setState({ slide: (s.slide + slides.length - 1) % slides.length }),
      nextSlide: () => this.setState({ slide: (s.slide + 1) % slides.length }),
      pauseSlides: () => this.setState({ slidesPaused: true }),
      resumeSlides: () => this.setState({ slidesPaused: false }),
      review: reviews[s.review],
      reviewDots: reviews.map((r, i) => ({ cls: i === s.review ? 'dot on' : 'dot', pressed: i === s.review ? 'true' : 'false', label: 'Review ' + (i + 1), pick: () => this.setState({ review: i }) })),
      prevReview: () => this.setState({ review: (s.review + reviews.length - 1) % reviews.length }),
      nextReview: () => this.setState({ review: (s.review + 1) % reviews.length }),
      pauseReviews: () => this.setState({ reviewsPaused: true }),
      resumeReviews: () => this.setState({ reviewsPaused: false })
    };
  }
}
</script></head><body><template id="tpl">

<main>

<!-- 1. Hero image slider (after Magna Cabinets): swipe, drag, edge arrows, keyboard -->
<section class="{{ sliderCls }}" aria-roledescription="carousel" aria-label="Featured projects" tabindex="0" onKeyDown="{{ onKey }}" onMouseEnter="{{ pauseSlides }}" onMouseLeave="{{ resumeSlides }}" onPointerDown="{{ dragStart }}" onPointerMove="{{ dragMove }}" onPointerUp="{{ dragEnd }}" onPointerCancel="{{ dragEnd }}" onPointerLeave="{{ dragEnd }}">
  <div class="track" style="transform: translateX(calc({{ slideX }} + {{ dragPx }}px))">
    <sc-for list="{{ slides }}" as="s" hint-placeholder-count="6">
      <figure class="{{ s.cls }}" role="group" aria-roledescription="slide" aria-label="{{ s.pos }}" style="margin: 0">
        <img src="{{ s.src }}" alt="{{ s.alt }}" draggable="false">
        <figcaption class="slide-tag"><span class="meta" style="color: #F5A546">{{ s.kind }}</span><span class="d5">{{ s.name }}</span></figcaption>
      </figure>
    </sc-for>
  </div>
  <div class="hero-shade"></div>
  <div class="hs-c">
    <div class="w">
      <h1 class="d1 rot-h" style="max-width: 980px"><span class="sr-only">We design, build and install custom millwork, kitchens and vanities, epoxy river tables, reception desks, feature walls and interior fit-outs.</span><span aria-hidden="true">We design, build &amp; install<span class="rot"><sc-for list="{{ rotWords }}" as="w" hint-placeholder-count="6"><span class="{{ w.cls }}">{{ w.t }}</span></sc-for></span></span></h1>
      <div class="stk" style="display: flex; justify-content: space-between; align-items: flex-end; gap: 32px">
        <p class="lede" style="color: #E4DCD0">Designed, built in our own shop and installed by one team, for commercial interiors and private homes across [service area].</p>
        <div class="stk" style="display: flex; gap: 14px; flex-wrap: wrap">
          <a class="btn" href="Quote.html">Get a Quote</a>
          <a class="btn btn-line" href="#work">See our work</a>
        </div>
      </div>
    </div>
  </div>
  <button type="button" class="arrow edge l" aria-label="Previous slide" onClick="{{ prevSlide }}"><svg width="20" height="20" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M11 3L5 9l6 6"/></svg></button>
  <button type="button" class="arrow edge r" aria-label="Next slide" onClick="{{ nextSlide }}"><svg width="20" height="20" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M7 3l6 6-6 6"/></svg></button>
  <div class="sl-foot">
    <div class="dots" role="group" aria-label="Choose a slide">

      </sc-for>
    </div>

  </div>

<!-- 2b. Scroll story: one wall, from bare drywall to lights on -->

        <img class="story-frame" src="../media/wall-day.webp" alt="The finished live-edge wood feature wall with a resin river" loading="lazy">
        <img class="story-frame" src="../media/wall-blue.webp" alt="The finished wall lit by blue LEDs along the river" loading="lazy">
      <div class="story-glow" aria-hidden="true"></div>
      <div class="story-shade" aria-hidden="true"></div>
    </div>
    <div class="w story-ui">
      <div class="story-head"><span class="meta" style="color: #F5A546">Recent project &middot; Restaurant feature wall</span><h2 id="story-h" class="d4">One wall, from concept to completion</h2></div>
      <div class="story-caps">
        <div class="story-cap"><span class="meta num">01 &middot; Before</span><h3 class="d2">A bare dining-room wall.</h3><p class="p">Rails fixed and levelled to carry every panel.</p></div>
        <div class="story-cap"><span class="meta num">02 &middot; Install</span><h3 class="d2">Fitted panel by panel.</h3><p class="p">Our own crew sets each live-edge board in place.</p></div>
        <div class="story-cap"><span class="meta num">03 &middot; Complete</span><h3 class="d2">One continuous river.</h3><p class="p">Live-edge boards, end-grain rounds and bark in a single wall.</p></div>
        <div class="story-cap"><span class="meta num">04 &middot; Lights on</span><h3 class="d2">Then the lights come on.</h3><p class="p">Blue LEDs trace the river from end to end.</p></div>
      </div>
      <div class="story-track" aria-hidden="true">
        <div class="story-bar"><span></span></div>
        <ol>
          <li class="story-tick"><span class="meta num">01</span><span>Before</span></li>
          <li class="story-tick"><span class="meta num">02</span><span>Install</span></li>
          <li class="story-tick"><span class="meta num">03</span><span>Complete</span></li>
          <li class="story-tick"><span class="meta num">04</span><span>Lights on</span></li>
        </ol>
      </div>
      <span class="story-hint meta" aria-hidden="true">Scroll</span>
    </div>
  </div>
</section>

<!-- 2. Two audiences -->

<!-- 3. From concept to completion: one real wall, three moments -->
<section class="s bg-ebony" aria-labelledby="c2c-h">
  <div class="w" style="display: flex; flex-direction: column; gap: 56px">
    <div class="g" style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 40px; align-items: end">
      <div style="grid-column: 1 / span 7; display: flex; flex-direction: column; gap: 18px">
        <span class="meta" style="color: #F5A546">Recent project &middot; Restaurant feature wall</span>
        <h2 id="c2c-h" class="d2">One wall, start to finish.</h2>
      </div>
      <p class="p" style="grid-column: 8 / span 5">A resin river feature wall for a restaurant dining room. Drawn, built in our shop and installed by our own crew.</p>
    </div>
    <div class="cmp" ref="{{ cmpRef }}" style="--pos: {{ cmpPos }}%">
      <img class="cmp-after" src="../media/cmp-after.webp" alt="After: the finished resin river feature wall above the dining booths" loading="lazy">
      <div class="cmp-before"><img src="../media/cmp-before-v2.webp" alt="Before: the bare dining room wall as our crew starts the install" loading="lazy"></div>
      <span class="cmp-tag cmp-l meta">Before</span>
      <span class="cmp-tag cmp-r meta">After</span>
      <span class="cmp-line" aria-hidden="true"><span class="cmp-knob"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 6l-5 5 5 5M14 6l5 5-5 5"/></svg></span></span>
      <input class="cmp-range" type="range" min="0" max="100" step="0.5" value="{{ cmpPos }}" aria-label="Before and after: drag to compare" onInput="{{ cmpMove }}">
