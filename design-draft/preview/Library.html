<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Library (internal) | SnM Millwork</title><meta name="description" content="Internal list of SnM project photos. Not part of the public website."><meta name="robots" content="noindex"><link rel="icon" type="image/png" href="../media/favicon-64.png"><link rel="apple-touch-icon" href="../media/favicon-180.png"><link rel="stylesheet" href="snm.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&amp;family=Cormorant+Garamond:ital,wght@0,500;1,500&amp;family=Jost:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0;background:#121212}</style>
<script src="runtime.js"></script><script>
class Component extends DCLogic {
  renderVals() {
    const C = { live: '#F5A546', liveai: '#F5A546', alt: '#5FC9CC', ai: '#E5735C' };
    const row = (n, id, file, name, status, where) => ({
      n, src: id, file, name, where,
      status: status === 'live' ? 'Live' : status === 'liveai' ? 'Live · AI-enhanced' : status === 'alt' ? 'Alternate' : 'Alternate · AI-edited',
      color: C[status]
    });
    const groups = [
      { title: 'On the site now', items: [
        row(1, '../media/wall-blue.webp', 'wall-blue.webp', 'River wall, blue LEDs', 'live', 'Homepage: For builders and designers'),
        row(2, '../media/wall-blue-slide.webp', 'wall-blue-slide.webp', 'River wall, blue LEDs (slider crop)', 'live', 'Homepage B: slide 1'),
        row(3, '../media/wall-day.webp', 'wall-day.webp', 'River wall, lights off', 'live', 'Commercial: hero and gallery'),
        row(4, '../media/wall-amber.webp', 'wall-amber.webp', 'River wall, amber and blue', 'live', 'Commercial: gallery'),
        row(8, '../media/install-crew.webp', 'install-crew.webp', 'Crew installing the wall (full)', 'live', 'Commercial gallery, About, Homepage: Built by our own crew, Services and Installation'),
        row(10, '../media/table-blue-v2.webp', 'table-blue-v2.webp', 'Blue river table', 'live', 'Homepage B slider, Epoxy gallery'),
        row(11, '../media/table-red-v2.webp', 'table-red-v2.webp', 'Red river table', 'live', 'Homepage B slider, Epoxy gallery'),
        row(12, '../media/resin-bark-v2.webp', 'resin-bark-v2.webp', 'Bark set before the pour', 'live', 'Epoxy gallery'),
        row(13, '../media/resin-bark.webp', 'resin-bark.webp', 'Bark set before the pour (portrait)', 'live', 'About: small tile'),
        row(19, '../media/cmp-after.webp', 'cmp-after.webp', 'River wall with booths, wide', 'liveai', 'Homepage: before/after slider, After side'),
        row(21, '../media/cmp-before-v2.webp', 'cmp-before-v2.webp', 'Bare wall, crew starting the install', 'liveai', 'Homepage: before/after slider, Before side'),
        row(16, '../media/library/ai-wall-staged.webp', 'ai-wall-staged.webp', 'River wall, staged with booths and decor', 'liveai', 'Homepage B: slider slide 2'),
        row(17, '../media/library/ai-pour-team.webp', 'ai-pour-team.webp', 'Team pouring blue resin', 'liveai', 'Epoxy: How a resin piece is made'),
        row(18, '../media/library/ai-fitout-sanding.webp', 'ai-fitout-sanding.webp', 'Fit-out with sanding', 'liveai', 'About tile, Trade Coordination page and card')
      ] },
      { title: 'Alternates, not in use', items: [
        row(9, '../media/team-site.webp', 'team-site.webp', 'Team on site (selfie)', 'alt', 'Removed from the site at your request'),
        row(20, '../media/cmp-before.webp', 'cmp-before.webp', 'Bare wall, straightened', 'alt', 'Was the slider Before side; replaced by #21'),
        row(5, '../media/step-before.webp', 'step-before.webp', 'Bare wall with mounting rails', 'alt', 'Was the homepage step 01; the drag slider uses #20'),
        row(6, '../media/step-during.webp', 'step-during.webp', 'Crew fitting the panels', 'alt', 'Was the homepage step 02'),
        row(7, '../media/step-after.webp', 'step-after.webp', 'Finished wall (portrait crop)', 'alt', 'Was the homepage step 03'),
        row(14, '../media/table-blue.webp', 'table-blue.webp', 'Blue river table, first retouch', 'alt', 'Replaced by #10'),
        row(15, '../media/table-red.webp', 'table-red.webp', 'Red river table, first retouch (portrait)', 'alt', 'Replaced by #11')
      ] }
    ];
    return { groups };
  }
}
</script></head><body><template id="tpl">
<div style="background: #121212; color: #F3EEE6; font-family: Jost, sans-serif; padding: 72px 0 96px">
  <div class="w" style="display: flex; flex-direction: column; gap: 48px">
    <div style="display: flex; flex-direction: column; gap: 14px; max-width: 760px">
      <span class="meta" style="color: #F5A546">Not part of the website</span>
      <h1 class="d2">Image library</h1>
      <p class="p">Every SnM photo on file, numbered. "Live" photos are on the site now. "Alternate" photos are kept for swapping in later: ask for "library #12 on the homepage" and it goes in. AI-edited and AI-enhanced images are marked, so you always know which photos show the work exactly as built.</p>
    </div>

    <sc-for list="{{ groups }}" as="g" hint-placeholder-count="2">
      <section style="display: flex; flex-direction: column; gap: 24px">
        <h2 class="d4" style="border-bottom: 1px solid #2E2A26; padding-bottom: 14px">{{ g.title }}</h2>
        <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px">
          <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="4">
            <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
              <div style="position: relative; aspect-ratio: 4 / 3; background: #1C1A18; border-radius: 2px; overflow: hidden">
                <img src="{{ it.src }}" alt="{{ it.name }}" loading="lazy" style="width: 100%; height: 100%; object-fit: contain">
                <span class="num" style="position: absolute; left: 10px; top: 10px; padding: 4px 9px; background: rgba(10,9,8,.85); border-radius: 2px; font-size: 14px">#{{ it.n }}</span>
              </div>
              <figcaption style="display: flex; flex-direction: column; gap: 4px">
                <span class="meta" style="color: {{ it.color }}">{{ it.status }}</span>
                <span style="font-weight: 500">{{ it.name }}</span>
                <span class="p" style="font-size: 14px">{{ it.where }}</span>
                <span class="p" style="font-size: 13px; color: #8F867B">{{ it.file }}</span>
              </figcaption>
            </figure>
          </sc-for>
        </div>
      </section>
    </sc-for>
  </div>
</div>
</template><div id="root"></div></body></html>
