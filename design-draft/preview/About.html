<script src="runtime.js"></script><script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { menuOpen: false };
  }
  renderVals() {
    return {
      menuOpen: this.state.menuOpen,
      menuOpenStr: this.state.menuOpen ? 'true' : 'false',
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen })
    };
  }
}
</script></head><body><template id="tpl">

          <a href="Millwork.html">Millwork &amp; Cabinetry</a>

  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav class="mnav" aria-label="Mobile">
      <a href="Main.html">Home</a>
      <a href="Commercial.html">Commercial</a>

<section class="s" style="padding-top: 104px; padding-bottom: 96px">
  <div class="w" style="display: flex; flex-direction: column; gap: 32px; max-width: 1040px">
    <h1 class="d1">A workshop that still signs its work.</h1>
    <p class="lede" style="color: #B9AFA2">[Founding story in two or three sentences: who started SnM, when, where, and why they chose to design, build and install everything themselves.]</p>
  </div>
</section>

<section style="padding-bottom: 128px">
  <div class="w g" style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 24px">

    <div style="grid-column: 9 / span 4; display: flex; flex-direction: column; gap: 24px">
      <img class="cover" src="../media/library/ai-fitout-sanding.webp" alt="SnM crew sanding table tops during a restaurant fit-out" style="flex: 1 1 0; min-height: 220px">
      <img class="cover" src="../media/resin-bark.webp" alt="Bark pieces and live-edge strips laid in a mould before a resin pour" style="flex: 1 1 0; min-height: 220px">
    </div>
  </div>
</section>

<!-- Founder -->
<section class="s bg-sand">
  <div class="w g" style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 40px; align-items: center">
    <div class="ph t-ink r-45" style="grid-column: 1 / span 5"><i>[Portrait: founder in the workshop]</i></div>
    <figure style="grid-column: 7 / span 6; margin: 0; display: flex; flex-direction: column; gap: 24px">
      <blockquote class="d3" style="margin: 0; font-style: italic; line-height: 1.3">“[A sentence from the founder on what good work means to them.]”</blockquote>
      <figcaption style="display: flex; flex-direction: column; gap: 4px"><span class="d5">[Founder name]</span><span class="p" style="font-size: 15px">Founder, SnM Millwork Manufacturing Inc.</span></figcaption>
    </figure>
  </div>
</section>

<!-- How we work: the brand values, shown as practice -->
<section class="s">
  <div class="w" style="display: flex; flex-direction: column; gap: 56px">
    <h2 class="d2" style="max-width: 720px">How we work</h2>
    <div class="g" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 48px">
      <div class="rule-top" style="display: flex; flex-direction: column; gap: 12px"><h3 class="d4">Warm</h3><p class="p">We answer the phone, we explain choices in plain language and we treat your home or site as our own.</p></div>
      <div class="rule-top" style="display: flex; flex-direction: column; gap: 12px"><h3 class="d4">Bold</h3><p class="p">We take on pieces other shops turn down, like 12-foot resin pours and curved reception desks.</p></div>
      <div class="rule-top" style="display: flex; flex-direction: column; gap: 12px"><h3 class="d4">Refined</h3><p class="p">Tight joints, matched grain and edges you want to run a hand along. Details are the job.</p></div>
    </div>
  </div>
</section>

<!-- The shop and credentials -->
<section class="s bg-ebony">
  <div class="w g" style="display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 40px">
    <div style="grid-column: 1 / span 5; display: flex; flex-direction: column; gap: 20px">
      <h2 class="d2">The shop</h2>
      <p class="p">[Square footage, location, key equipment such as CNC and spray booth, and team size.]</p>
    </div>
    <dl class="num" style="grid-column: 7 / span 6; margin: 0">
      <div class="rule-top" style="display: flex; justify-content: space-between; gap: 24px; padding-bottom: 20px"><dt>Workshop</dt><dd style="margin: 0; color: #F5A546">[X,XXX sq ft, City]</dd></div>
      <div class="rule-top" style="display: flex; justify-content: space-between; gap: 24px; padding-bottom: 20px"><dt>Team</dt><dd style="margin: 0; color: #F5A546">[XX craftspeople and installers]</dd></div>
      <div class="rule-top" style="display: flex; justify-content: space-between; gap: 24px; padding-bottom: 20px"><dt>Insurance</dt><dd style="margin: 0; color: #F5A546">[$X million liability]</dd></div>
      <div class="rule-top" style="display: flex; justify-content: space-between; gap: 24px; padding-bottom: 20px"><dt>Safety</dt><dd style="margin: 0; color: #F5A546">[WSIB clearance]</dd></div>
      <div class="rule-top" style="display: flex; justify-content: space-between; gap: 24px; padding-bottom: 20px; border-bottom: 1px solid #2E2A26"><dt>Memberships</dt><dd style="margin: 0; color: #F5A546">[AWMAC or others]</dd></div>
    </dl>
  </div>
</section>

<section class="s">
  <div class="w stk" style="display: flex; justify-content: space-between; align-items: center; gap: 40px">
    <div style="display: flex; flex-direction: column; gap: 18px; max-width: 640px">
      <h2 class="d2">Come see the shop.</h2>
      <p class="p">Visits are by appointment. Bring your drawings or just your questions.</p>
    </div>
    <a class="btn" href="Quote.html">Get a Quote</a>
  </div>
</section>

  <div class="ftr">
    <div class="w ftr-g">

    <div class="w ftr-b"><span>© 2026 SnM Millwork Manufacturing Inc.</span><span>[Instagram] [LinkedIn]</span></div>
